<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Thank You!</title>
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      font-family: 'Segoe UI', 'Arial', sans-serif;
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
    }

    /* Animated Pastel Blobs */
    .blob {
      position: absolute;
      border-radius: 50%;
      opacity: 0.45;
      filter: blur(40px);
      animation: blobMove 16s infinite alternate ease-in-out;
      z-index: 0;
    }
    .blob1 {
      width: 400px; height: 400px; background: #fbc2eb;
      top: -120px; left: -120px;
      animation-delay: 0s;
    }
    .blob2 {
      width: 350px; height: 350px; background: #a1c4fd;
      bottom: -90px; right: -90px;
      animation-delay: 2s;
    }
    .blob3 {
      width: 320px; height: 320px; background: #cfd9df;
      top: 60%; left: 70%;
      transform: translate(-50%, -50%);
      animation-delay: 4s;
    }
    @keyframes blobMove {
      0% { transform: scale(1) translateY(0) translateX(0);}
      50% { transform: scale(1.1) translateY(30px) translateX(35px);}
      100% { transform: scale(1) translateY(0) translateX(0);}
    }

    .glass-card {
      background: rgba(255,255,255,0.22);
      border-radius: 30px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.08);
      backdrop-filter: blur(16px);
      padding: 60px 50px 40px 50px;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 2;
    }

    .thankyou-message {
      font-size: 3.2rem;
      color: #7d5fff;
      font-weight: bold;
      text-align: center;
      margin-bottom: 20px;
      animation: pop 1s ease;
      letter-spacing: 2px;
      text-shadow: 0 2px 10px #fff5;
    }
    @keyframes pop {
      0% { transform: scale(0.6); opacity: 0; }
      70% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1); }
    }
    .emoji {
      font-size: 4rem;
      animation: bounce 1.2s infinite alternate;
      display: inline-block;
      margin: 0 10px;
    }
    @keyframes bounce {
      0% { transform: translateY(0);}
      100% { transform: translateY(-17px);}
    }
    .subtext {
      font-size: 1.5rem;
      color: #444;
      margin-top: 20px;
      animation: fadeIn 2s;
      text-align: center;
      text-shadow: 0 2px 6px #fff4;
    }
    @keyframes fadeIn {
      from { opacity: 0;}
      to { opacity: 1;}
    }
    .home-btn {
      margin-top: 35px;
      padding: 16px 40px;
      background: linear-gradient(90deg,#7d5fff 40%,#70a1ff 100%);
      color: #fff;
      border: none;
      border-radius: 30px;
      font-size: 1.2rem;
      cursor: pointer;
      box-shadow: 0 2px 15px rgba(112,161,255,0.18);
      transition: background 0.3s, transform 0.3s;
      animation: fadeIn 2.5s;
      font-weight: 600;
      letter-spacing: 1px;
    }
    .home-btn:hover {
      background: linear-gradient(90deg,#70a1ff 40%,#7d5fff 100%);
      transform: scale(1.08);
    }
    @media (max-width: 600px) {
      .glass-card { padding: 30px 10px 25px 10px;}
      .thankyou-message { font-size: 2rem;}
      .emoji { font-size: 2.2rem;}
      .subtext { font-size: 1rem;}
      .home-btn { padding: 10px 20px; font-size: 1rem;}
    }
  </style>
</head>
<body>
  <!-- Animated Blobs -->
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>
  <!-- Glass Card with Thank You Message -->
  <div class="glass-card">
    <div class="thankyou-message">
      <span class="emoji">🥳</span>
      Thank You For Reaching Out!
      <span class="emoji">💌</span>
    </div>
    <div class="subtext">
      We've received your message and will get back to you soon.<br>
      Have a wonderful day! <span class="emoji">🌈</span>
    </div>
    <button class="home-btn" onclick="window.location.href='index.html'">← Back to Home</button>
  </div>
</body>
</html>
