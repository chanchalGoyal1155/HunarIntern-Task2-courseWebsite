<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Thank You!</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Google Fonts for Modern Look -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Montserrat:700,400&display=swap">

  <style>
    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      font-family: 'Montserrat', 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
      overflow: hidden;
      position: relative;
    }

    /* Animated Pastel Blobs */
    .blob {
      position: absolute;
      border-radius: 50%;
      opacity: 0.45;
      filter: blur(36px);
      animation: blobMove 16s infinite alternate ease-in-out;
      z-index: 0;
    }
    .blob1 {
      width: 400px; height: 400px; background: #fbc2eb;
      top: -120px; left: -120px;
      animation-delay: 0s;
    }
    .blob2 {
      width: 350px; height: 350px; background: #a1c4fd;
      bottom: -90px; right: -90px;
      animation-delay: 2s;
    }
    .blob3 {
      width: 320px; height: 320px; background: #cfd9df;
      top: 60%; left: 70%;
      transform: translate(-50%, -50%);
      animation-delay: 4s;
    }
    @keyframes blobMove {
      0% { transform: scale(1) translateY(0) translateX(0);}
      50% { transform: scale(1.1) translateY(30px) translateX(35px);}
      100% { transform: scale(1) translateY(0) translateX(0);}
    }

    /* Glass Card with Gradient Border */
    .glass-card {
      position: relative;
      z-index: 2;
      background: rgba(255,255,255,0.22);
      border-radius: 32px;
      backdrop-filter: blur(14px);
      box-shadow: 0 8px 40px rgba(0,0,0,0.10), 0 2px 24px #a8edea55;
      padding: 60px 54px 40px 54px;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 4px solid transparent;
      background-clip: padding-box;
    }
    .glass-card::before {
      content: '';
      position: absolute;
      z-index: -1;
      inset: -4px;
      border-radius: 36px;
      padding: 0;
      background: linear-gradient(110deg, #a1c4fd 0%, #fbc2eb 100%);
      filter: blur(0px);
      transition: filter 0.3s;
    }
    .glass-card:hover::before {
      filter: blur(5px);
    }

    /* Confetti Animation */
    .confetti {
      position: absolute;
      z-index: 5;
      top: 0; left: 0; width: 100vw; height: 100vh;
      pointer-events: none;
    }

    /* Thank You Heading */
    .thankyou-message {
      font-size: 3.2rem;
      color: #7d5fff;
      font-weight: 700;
      text-align: center;
      margin-bottom: 18px;
      letter-spacing: .5px;
      text-shadow: 0 2px 10px #fff5;
      animation: pop 1s cubic-bezier(.71,1.7,.77,1.24);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    @keyframes pop {
      0% { transform: scale(0.7); opacity: 0; }
      60% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1); }
    }
    .emoji {
      font-size: 3.5rem;
      animation: bounce 1.3s infinite alternate cubic-bezier(.61,.1,.32,1.07);
      margin: 0 8px;
      display: inline-block;
    }
    @keyframes bounce {
      0% { transform: translateY(0);}
      100% { transform: translateY(-15px);}
    }
    .subtext {
      font-size: 1.3rem;
      color: #444;
      margin-top: 18px;
      animation: fadeIn 1.4s;
      text-align: center;
      text-shadow: 0 2px 6px #fff4;
      font-weight: 500;
    }
    @keyframes fadeIn {
      from { opacity: 0;}
      to { opacity: 1;}
    }
    .success-icon {
      font-size: 3rem;
      margin-bottom: 12px;
      color: #70a1ff;
      text-shadow: 0 2px 10px #fff8;
      animation: spinIn 0.8s;
    }
    @keyframes spinIn {
      0% { transform: scale(0.5) rotate(-190deg); opacity: 0;}
      100% { transform: scale(1) rotate(0deg); opacity: 1;}
    }
    .home-btn {
      margin-top: 34px;
      padding: 15px 38px;
      background: linear-gradient(90deg,#7d5fff 40%,#70a1ff 100%);
      color: #fff;
      border: none;
      border-radius: 30px;
      font-size: 1.2rem;
      cursor: pointer;
      box-shadow: 0 2px 18px rgba(112,161,255,0.16);
      font-weight: 600;
      letter-spacing: 1px;
      transition: background 0.3s, transform 0.3s;
      animation: fadeIn 2.2s;
      outline: none;
      border: 2px solid #fff6;
    }
    .home-btn:hover {
      background: linear-gradient(90deg,#70a1ff 40%,#7d5fff 100%);
      transform: scale(1.07);
      box-shadow: 0 4px 20px #a1c4fd44;
    }
    .footer-text {
      margin-top: 50px;
      font-size: 1rem;
      color: #888;
      text-align: center;
      letter-spacing: .2px;
      z-index: 2;
    }
    @media (max-width: 600px) {
      .glass-card { padding: 28px 8px 16px 8px;}
      .thankyou-message { font-size: 1.5rem;}
      .emoji { font-size: 1.6rem;}
      .success-icon { font-size: 2rem;}
      .subtext { font-size: .98rem;}
      .home-btn { padding: 10px 20px; font-size: .95rem;}
    }
  </style>
</head>
<body>
  <!-- Pastel Blobs -->
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>

  <!-- Confetti Canvas -->
  <canvas id="confetti" class="confetti"></canvas>

  <div class="glass-card">
    <div class="success-icon">✅</div>
    <div class="thankyou-message">
      <span class="emoji">🥳</span>
      Thank You For Reaching Out!
      <span class="emoji">💌</span>
    </div>
    <div class="subtext">
      We've received your message and will get back to you soon.<br>
      <span style="font-size:1.3rem;">Enjoy your day! <span class="emoji">🌈</span></span>
    </div>
    <button class="home-btn" onclick="window.location.href='index.html'">← Back to Home</button>
  </div>
  <div class="footer-text">
    Made with ❤️ for Final Year Project &mdash; All the best for your bright future!
  </div>

  <!-- Confetti JS -->
  <script>
    
  // Simple pastel confetti
  const canvas = document.getElementById("confetti");
  const ctx = canvas.getContext("2d");
  let confetti = [];
  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener("resize", resizeCanvas);
  resizeCanvas();
  function randomColor() {
    const pastel = [
      "#fbc2eb", "#a1c4fd", "#cfd9df", "#fff6b7", "#fda085", "#b5ead7", "#ffdac1"
    ];
    return pastel[Math.floor(Math.random()*pastel.length)];
  }
  function ConfettiParticle() {
    this.x = Math.random() * canvas.width;
    this.y = Math.random() * -canvas.height;
    this.r = 6 + Math.random() * 8;
    this.d = Math.random() * 90;
    this.color = randomColor();
    this.tilt = Math.random() * 10 - 10;
    this.speed = 1.9 + Math.random() * 2.2;
    this.angle = Math.random() * Math.PI * 2;
    this.update = function() {
      this.y += this.speed;
      this.tilt = Math.sin(this.angle += 0.03) * 12;
      if (this.y > canvas.height + 10) {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * -20;
        this.tilt = Math.random() * 10 - 10;
        this.color = randomColor();
      }
    }
    this.draw = function() {
      ctx.beginPath();
      ctx.ellipse(this.x, this.y, this.r, this.r/2, this.tilt, 0, Math.PI*2);
      ctx.fillStyle = this.color;
      ctx.globalAlpha = 0.74;
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }
  function createConfetti() {
    confetti = [];
    for(let i=0; i<48; i++) {
      confetti.push(new ConfettiParticle());
    }
  }
  function animateConfetti() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    for(let i=0; i<confetti.length; i++) {
      confetti[i].update();
      confetti[i].draw();
    }
    requestAnimationFrame(animateConfetti);
  }
  createConfetti();
  animateConfetti();
  </script>
</body>
</html>
