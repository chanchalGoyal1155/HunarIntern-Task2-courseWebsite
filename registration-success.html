<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Registration Successful!</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Montserrat:700,400&display=swap">
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      font-family: 'Montserrat', 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #a8edea 0%, #fbc2eb 50%, #a1c4fd 100%);
      overflow: hidden;
      position: relative;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      opacity: 0.38;
      filter: blur(40px);
      animation: blobMove 14s infinite alternate ease-in-out;
      z-index: 0;
    }
    .blob1 {
      width: 380px; height: 380px; background: #fbc2eb;
      top: -100px; left: -120px;
      animation-delay: 0s;
    }
    .blob2 {
      width: 340px; height: 340px; background: #a1c4fd;
      bottom: -100px; right: -100px;
      animation-delay: 2s;
    }
    .blob3 {
      width: 300px; height: 300px; background: #a8edea;
      top: 65%; left: 72%;
      transform: translate(-50%, -50%);
      animation-delay: 3s;
    }
    @keyframes blobMove {
      0% { transform: scale(1) translateY(0) translateX(0);}
      50% { transform: scale(1.08) translateY(25px) translateX(30px);}
      100% { transform: scale(1) translateY(0) translateX(0);}
    }
    .glass-card {
      position: relative;
      z-index: 2;
      background: rgba(255,255,255,0.21);
      border-radius: 32px;
      backdrop-filter: blur(13px);
      box-shadow: 0 8px 40px rgba(0,0,0,0.12), 0 2px 24px #a1c4fd33;
      padding: 56px 52px 38px 52px;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 4px solid transparent;
      background-clip: padding-box;
    }
    .glass-card::before {
      content: '';
      position: absolute;
      z-index: -1;
      inset: -4px;
      border-radius: 36px;
      padding: 0;
      background: linear-gradient(120deg, #fbc2eb 0%, #a1c4fd 50%, #a8edea 100%);
      filter: blur(2px);
      transition: filter 0.3s;
    }
    .glass-card:hover::before {
      filter: blur(7px);
    }

    .confetti {
      position: absolute;
      z-index: 5;
      top: 0; left: 0; width: 100vw; height: 100vh;
      pointer-events: none;
    }

    .welcome-message {
      font-size: 3.1rem;
      color: #7d5fff;
      font-weight: 700;
      text-align: center;
      margin-bottom: 17px;
      letter-spacing: .5px;
      text-shadow: 0 2px 10px #fff4;
      animation: pop 1s cubic-bezier(.71,1.7,.77,1.24);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }
    @keyframes pop {
      0% { transform: scale(0.7); opacity: 0; }
      60% { transform: scale(1.12); opacity: 1; }
      100% { transform: scale(1); }
    }
    .emoji {
      font-size: 3.2rem;
      animation: float 1.7s infinite alternate cubic-bezier(.61,.1,.32,1.07);
      margin: 0 6px;
      display: inline-block;
    }
    @keyframes float {
      0% { transform: translateY(0);}
      100% { transform: translateY(-12px);}
    }
    .success-icon {
      font-size: 3.2rem;
      margin-bottom: 12px;
      color: #a1c4fd;
      text-shadow: 0 2px 10px #fff8;
      animation: spinIn 0.7s;
    }
    @keyframes spinIn {
      0% { transform: scale(0.2) rotate(-290deg); opacity: 0;}
      100% { transform: scale(1) rotate(0deg); opacity: 1;}
    }
    .subtext {
      font-size: 1.25rem;
      color: #2a3a3a;
      margin-top: 17px;
      animation: fadeIn 1.3s;
      text-align: center;
      text-shadow: 0 2px 6px #fff4;
      font-weight: 500;
    }
    @keyframes fadeIn {
      from { opacity: 0;}
      to { opacity: 1;}
    }
    .home-btn {
      margin-top: 34px;
      padding: 15px 38px;
      background: linear-gradient(90deg,#a1c4fd 40%,#fbc2eb 100%);
      color: #fff;
      border: none;
      border-radius: 30px;
      font-size: 1.2rem;
      cursor: pointer;
      box-shadow: 0 2px 18px rgba(112,161,255,0.18);
      font-weight: 600;
      letter-spacing: 1px;
      transition: background 0.3s, transform 0.3s;
      animation: fadeIn 2.1s;
      outline: none;
      border: 2px solid #fff5;
    }
    .home-btn:hover {
      background: linear-gradient(90deg,#fbc2eb 40%,#a1c4fd 100%);
      transform: scale(1.08);
      box-shadow: 0 4px 20px #a1c4fd55;
    }
    .footer-text {
      margin-top: 52px;
      font-size: 1.02rem;
      color: #7d5fff;
      text-align: center;
      letter-spacing: .2px;
      z-index: 2;
    }
    @media (max-width: 600px) {
      .glass-card { padding: 28px 8px 16px 8px;}
      .welcome-message { font-size: 1.6rem;}
      .emoji { font-size: 1.5rem;}
      .success-icon { font-size: 2rem;}
      .subtext { font-size: .95rem;}
      .home-btn { padding: 10px 20px; font-size: .97rem;}
    }
  </style>
</head>
<body>
  <!-- Pastel Blobs -->
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>

  <!-- Confetti Canvas -->
  <canvas id="confetti" class="confetti"></canvas>

  <div class="glass-card">
    <div class="success-icon">🎓</div>
    <div class="welcome-message">
      <span class="emoji">🎉</span>
      Registration Successful!
      <span class="emoji">🥰</span>
    </div>
    <div class="subtext">
      Welcome to our learning family.<br>
      We can't wait to see your success! <span class="emoji">🚀</span>
    </div>
    <button class="home-btn" onclick="window.location.href='index.html'">Go to Home</button>
  </div>
  <div class="footer-text">
    You are ready to start your journey. <span style="font-size:1.2rem;">🌟</span><br>
    All the best!
  </div>
  <script>
  // Confetti: Pastel circles/stars
  const canvas = document.getElementById("confetti");
  const ctx = canvas.getContext("2d");
  let confetti = [];
  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener("resize", resizeCanvas);
  resizeCanvas();
  function randomColor() {
    const pastel = [
      "#a1c4fd", "#fbc2eb", "#a8edea", "#fed6e3", "#cfd9df"
    ];
    return pastel[Math.floor(Math.random()*pastel.length)];
  }
  function drawStar(x, y, r, color, angle) {
    ctx.save();
    ctx.beginPath();
    ctx.translate(x, y);
    ctx.rotate(angle);
    ctx.moveTo(0, -r);
    for (let i = 0; i < 5; i++) {
      ctx.rotate(Math.PI / 5);
      ctx.lineTo(0, -r * 0.5);
      ctx.rotate(Math.PI / 5);
      ctx.lineTo(0, -r);
    }
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.globalAlpha = 0.7;
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.restore();
  }
  function ConfettiParticle() {
    this.x = Math.random() * canvas.width;
    this.y = Math.random() * -canvas.height;
    this.r = 7 + Math.random() * 7;
    this.d = Math.random() * 80;
    this.color = randomColor();
    this.tilt = Math.random() * 10 - 10;
    this.speed = 2 + Math.random() * 2.4;
    this.angle = Math.random() * Math.PI * 2;
    this.type = Math.random() > 0.5 ? "star" : "circle";
    this.rotate = Math.random() * Math.PI * 2;
    this.update = function() {
      this.y += this.speed;
      this.tilt = Math.sin(this.angle += 0.025) * 10;
      this.rotate += 0.04;
      if (this.y > canvas.height + 14) {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * -25;
        this.tilt = Math.random() * 10 - 10;
        this.color = randomColor();
        this.type = Math.random() > 0.5 ? "star" : "circle";
      }
    }
    this.draw = function() {
      if (this.type === "star") {
        drawStar(this.x, this.y, this.r, this.color, this.rotate);
      } else {
        ctx.beginPath();
        ctx.ellipse(this.x, this.y, this.r, this.r/2, this.tilt, 0, Math.PI*2);
        ctx.fillStyle = this.color;
        ctx.globalAlpha = 0.7;
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }
  }
  function createConfetti() {
    confetti = [];
    for(let i=0; i<50; i++) {
      confetti.push(new ConfettiParticle());
    }
  }
  function animateConfetti() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    for(let i=0; i<confetti.length; i++) {
      confetti[i].update();
      confetti[i].draw();
    }
    requestAnimationFrame(animateConfetti);
  }
  createConfetti();
  animateConfetti();
  </script>
  
</body>
</html>
